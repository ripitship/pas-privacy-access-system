<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="recovery-en-title recovery-en-desc"><title id="recovery-en-title">Recovery policy and limits</title><desc id="recovery-en-desc">P0 joint C plus R theft can enable misuse. P1 needs suitable prebinding and normally 48 hours. P2 is blocked. Total loss has no safe bypass without independent proof.</desc><rect width="720" height="330" rx="20" fill="#fff4e5"/><g font-family="Arial,sans-serif" fill="#51351b" text-anchor="middle"><text x="360" y="38" font-size="23">Recovery needs admissible evidence</text><g fill="white" stroke="#a57740" stroke-width="2"><rect x="25" y="68" width="205" height="130" rx="12"/><rect x="257" y="68" width="205" height="130" rx="12"/><rect x="489" y="68" width="205" height="130" rx="12"/></g><g font-size="21"><text x="127" y="102">P0</text><text x="360" y="102">P1</text><text x="592" y="102">P2</text></g><g font-size="16"><text x="127" y="137">Joint C + R theft</text><text x="127" y="167">Misuse risk</text><text x="360" y="137">Suitable prebinding</text><text x="360" y="167">Regular delay: 48h</text><text x="592" y="137">Blocked</text><text x="592" y="167">Hardware gates open</text><text x="360" y="242">Total loss without independent proof: no safe bypass</text><text x="360" y="281">Same-OS keys / witness ≠ independent HSM isolation</text></g></g></svg>
