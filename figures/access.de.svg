<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="access-de-title access-de-desc"><title id="access-de-title">Geschützte Zugangsentscheidung</title><desc id="access-de-desc">Authentisierung, aktuelle Berechtigung und explizite lokale Rollenbindung müssen erfolgreich sein. Sonst wird Zugang gesperrt, auch bei Core-Ausfall.</desc><rect width="720" height="300" rx="20" fill="#eef4fa"/><g font-family="Arial,sans-serif" fill="#16324f" text-anchor="middle"><text x="360" y="38" font-size="23">Drei Prüfungen vor jeder geschützten Aktion</text><g fill="white" stroke="#487b9d" stroke-width="2"><rect x="25" y="73" width="205" height="90" rx="12"/><rect x="257" y="73" width="205" height="90" rx="12"/><rect x="489" y="73" width="205" height="90" rx="12"/></g><g font-size="17"><text x="127" y="109">1 · Authentisieren</text><text x="127" y="138">Gültige Sitzung</text><text x="360" y="109">2 · Berechtigung</text><text x="360" y="138">Aktuelle Core-Prüfung</text><text x="592" y="109">3 · Lokale Bindung</text><text x="592" y="138">Identität + erlaubte Rolle</text></g><text x="360" y="211" font-size="21">Alle erfolgreich → begrenzte Aktion erlauben</text><text x="360" y="252" font-size="17">Fehlend, widerrufen oder unerreichbar → sperren (fail closed)</text></g></svg>
