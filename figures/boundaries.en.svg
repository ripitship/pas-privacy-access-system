<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="boundaries-en-title boundaries-en-desc"><title id="boundaries-en-title">PAS responsibility boundaries</title><desc id="boundaries-en-desc">Login authenticates. Core controls entitlement and recovery. The application checks current entitlement and local roles. Personal C/A/R do not reach the portal.</desc><rect width="720" height="320" rx="20" fill="#eef4fa"/><g font-family="Arial,sans-serif" fill="#16324f" text-anchor="middle"><text x="360" y="38" font-size="23">Customer operator controls deployment</text><g fill="white" stroke="#487b9d" stroke-width="2"><rect x="30" y="68" width="200" height="130" rx="12"/><rect x="260" y="68" width="200" height="130" rx="12"/><rect x="490" y="68" width="200" height="130" rx="12"/></g><g font-size="21"><text x="130" y="101">Login</text><text x="360" y="101">Core</text><text x="590" y="101">Application</text></g><g font-size="15"><text x="130" y="135">Authentication</text><text x="130" y="163">Separate management</text><text x="360" y="135">Entitlement + recovery</text><text x="360" y="163">Personal C / A / R</text><text x="590" y="135">Local identity + roles</text><text x="590" y="163">Current entitlement</text><text x="360" y="240">Portal: application-specific subject + scoped result</text><text x="360" y="272">No personal C / A / R at the portal · code possession is not identity</text></g></g></svg>
