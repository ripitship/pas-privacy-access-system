<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" role="img" aria-labelledby="recovery-de-title recovery-de-desc"><title id="recovery-de-title">Recovery-Regeln und Grenzen</title><desc id="recovery-de-desc">P0 mit gemeinsamem C- und R-Diebstahl erlaubt Missbrauch. P1 braucht Vorbindung und regulär 48 Stunden. P2 ist gesperrt. Totalverlust hat ohne unabhängigen Nachweis keinen sicheren Umweg.</desc><rect width="720" height="330" rx="20" fill="#fff4e5"/><g font-family="Arial,sans-serif" fill="#51351b" text-anchor="middle"><text x="360" y="38" font-size="23">Recovery braucht zulässige Nachweise</text><g fill="white" stroke="#a57740" stroke-width="2"><rect x="25" y="68" width="205" height="130" rx="12"/><rect x="257" y="68" width="205" height="130" rx="12"/><rect x="489" y="68" width="205" height="130" rx="12"/></g><g font-size="21"><text x="127" y="102">P0</text><text x="360" y="102">P1</text><text x="592" y="102">P2</text></g><g font-size="16"><text x="127" y="137">C + R gemeinsam</text><text x="127" y="167">Missbrauchsrisiko</text><text x="360" y="137">Geeignete Vorbindung</text><text x="360" y="167">Reguläre Wartezeit: 48h</text><text x="592" y="137">Gesperrt</text><text x="592" y="167">Hardwaregates offen</text><text x="360" y="242">Totalverlust ohne unabhängigen Nachweis: kein sicherer Umweg</text><text x="360" y="281">Gleiche OS-Identität für Schlüssel / Witness ≠ isoliertes HSM</text></g></g></svg>
