<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="boundaries-de-title boundaries-de-desc"><title id="boundaries-de-title">PAS-Verantwortungsgrenzen</title><desc id="boundaries-de-desc">Login authentisiert. Core kontrolliert Berechtigung und Recovery. Die Anwendung prüft aktuelle Berechtigung und lokale Rollen. Persönliche C/A/R gelangen nicht zum Portal.</desc><rect width="720" height="320" rx="20" fill="#eef4fa"/><g font-family="Arial,sans-serif" fill="#16324f" text-anchor="middle"><text x="360" y="38" font-size="23">Kundenbetreiber kontrolliert Bereitstellung</text><g fill="white" stroke="#487b9d" stroke-width="2"><rect x="30" y="68" width="200" height="130" rx="12"/><rect x="260" y="68" width="200" height="130" rx="12"/><rect x="490" y="68" width="200" height="130" rx="12"/></g><g font-size="21"><text x="130" y="101">Login</text><text x="360" y="101">Core</text><text x="590" y="101">Anwendung</text></g><g font-size="15"><text x="130" y="135">Authentisierung</text><text x="130" y="163">Getrennte Verwaltung</text><text x="360" y="135">Berechtigung + Recovery</text><text x="360" y="163">Persönliche C / A / R</text><text x="590" y="135">Lokale Identität + Rollen</text><text x="590" y="163">Aktuelle Berechtigung</text><text x="360" y="240">Portal: anwendungsspezifischer Subject + begrenztes Ergebnis</text><text x="360" y="272">Keine persönlichen C / A / R am Portal · Codebesitz ist keine Identität</text></g></g></svg>
