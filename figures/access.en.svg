<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="access-en-title access-en-desc"><title id="access-en-title">Protected access decision</title><desc id="access-en-desc">Authentication, current entitlement and explicit local role binding must all succeed. Otherwise access is denied, including Core outage.</desc><rect width="720" height="300" rx="20" fill="#eef4fa"/><g font-family="Arial,sans-serif" fill="#16324f" text-anchor="middle"><text x="360" y="38" font-size="23">Three checks before each protected action</text><g fill="white" stroke="#487b9d" stroke-width="2"><rect x="25" y="73" width="205" height="90" rx="12"/><rect x="257" y="73" width="205" height="90" rx="12"/><rect x="489" y="73" width="205" height="90" rx="12"/></g><g font-size="17"><text x="127" y="109">1 · Authenticate</text><text x="127" y="138">Valid session</text><text x="360" y="109">2 · Entitlement</text><text x="360" y="138">Current Core decision</text><text x="592" y="109">3 · Local binding</text><text x="592" y="138">Identity + allowed role</text></g><text x="360" y="211" font-size="21">All succeed → allow scoped action</text><text x="360" y="252" font-size="17">Missing, revoked or unavailable → deny (fail closed)</text></g></svg>
